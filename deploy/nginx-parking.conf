# =============================================================
# 上海停车情报站 · nginx 片段（部署在 ridingwind.cn 的 /parking 子路径）
# 用法：把 location 块并入现有 server{} 中（TLS 站点），不要覆盖整份配置
#   include /etc/nginx/snippets/parking.conf;   或在 server 块内粘贴
# 说明：应用监听 127.0.0.1:3100，前端静态文件在 /opt/parking-site/dist/web
# =============================================================

# /parking 补斜杠，避免相对路径解析成 /parkingxxx
location = /parking {
    return 301 /parking/;
}

# 前端静态资源（构建时 CLIENT_BASE_PATH=/parking，资源引用即 /parking/assets/...）
location /parking/assets/ {
    alias /opt/parking-site/dist/web/assets/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

location = /parking/favicon.svg {
    alias /opt/parking-site/dist/web/favicon.svg;
}

# 后端接口：剥掉 /parking 前缀
location /parking/api/ {
    proxy_pass http://127.0.0.1:3100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-miaoda-custom-host 1;
    proxy_read_timeout 60s;
    client_max_body_size 10m;
}

# SPA 入口与前端路由回退（/parking/list、/parking/detail/:id 等都回到同一入口）
location /parking/ {
    alias /opt/parking-site/dist/web/;
    index index.html;
    try_files $uri $uri/ /parking/index.html;
}
